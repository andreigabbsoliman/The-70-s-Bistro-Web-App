<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | The 70's Bistro Admin</title>
    <link rel="icon" type="image/png" href="../assets/images/tab%20image/logo%20no%20bg.png">
    <script>try { document.documentElement.dataset.theme = localStorage.getItem("bistro70s_theme") === "light" ? "light" : "dark"; } catch (e) { document.documentElement.dataset.theme = "dark"; }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/events.css">
</head>
<body data-page="events" data-title="Events">
    <main id="page">
        <div class="page-head">
            <div>
                <p class="eyebrow">Management</p>
                <h2>Events</h2>
                <p>The live-band schedule shown on the website, with ticket sales per show.</p>
            </div>
            <button class="btn btn-primary" id="addEventBtn">+ Add Event</button>
        </div>

        <div class="toolbar">
            <div class="search-box">
                <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input type="search" id="searchInput" placeholder="Search by band">
            </div>
            <select id="genreFilter" aria-label="Filter by genre"></select>
            <div class="chips" id="statusChips"></div>
        </div>

        <div class="event-grid" id="eventGrid"></div>
    </main>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/events.js"></script>
</body>
</html>
