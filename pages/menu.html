<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | The 70's Bistro Admin</title>
    <link rel="icon" type="image/png" href="../assets/images/tab%20image/logo%20no%20bg.png">
    <script>try { document.documentElement.dataset.theme = localStorage.getItem("bistro70s_theme") === "light" ? "light" : "dark"; } catch (e) { document.documentElement.dataset.theme = "dark"; }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/menu.css">
</head>
<body data-page="menu" data-title="Menu">
    <main id="page">
        <div class="page-head">
            <div>
                <p class="eyebrow">Management</p>
                <h2>Menu</h2>
                <p>The dishes shown on the website menu. Update prices and mark items sold out.</p>
            </div>
            <button class="btn btn-primary" id="addProductBtn">+ Add Dish</button>
        </div>

        <div class="toolbar">
            <div class="search-box">
                <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input type="search" id="searchInput" placeholder="Search dishes">
            </div>
            <select id="categoryFilter" aria-label="Filter by category"></select>
            <select id="availabilityFilter" aria-label="Filter by availability">
                <option value="">All availability</option>
                <option value="yes">Available</option>
                <option value="no">Sold out</option>
            </select>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </main>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/menu.js"></script>
</body>
</html>
